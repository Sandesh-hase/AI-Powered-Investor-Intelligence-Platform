name: Azure Login Test

on:
  push:
    branches:
      - cicd-setup

jobs:

  test-login:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: |
          az account show

      - name: Show Subscription
        run: |
          az account list --output table
